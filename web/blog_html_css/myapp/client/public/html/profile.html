<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link type="text/css" href="../css/headerfooter.css" rel="stylesheet">
    <link type="text/css" href="../css/styleprofile.css" rel="stylesheet">
    <link type="text/css" href="../css/commonstyle.css" rel="stylesheet">
    <link type="text/css" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300&display=swap" rel="stylesheet">
    <meta content=" width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0 " name="viewport ">
    <meta content="ie=edge " http-equiv="X-UA-Compatible ">

    <link rel="preconnect " href="https://fonts.gstatic.com ">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap " rel="stylesheet ">
</head>

<body>
    <header class="header ">
        <div class="block-menu-header ">
            <div><a href="main.html">Главная</a></div>
            <div><a class="click ">Профиль</a></div>
            <div><a href="newpost.html">Создать пост</a></div>
            <div><a href="log.html">Выход</a></div>
        </div>
    </header>
    <main>
        <div class="block-profile">
            <form class="profile styleshadow">
                <div class="profile-content">
                    <div class="ava">
                        <div class="button-change"><button>Изменить</button></div>
                        <img class="ava-img" src="../img/Cat.jpg" alt="">
                    </div>
                    <div class="input-name">
                        <div>
                            <div class="username">
                                <label>Псевдоним</label>
                            </div>
                            <div class="size">
                                <div class="button-change-input">
                                    <button>Изменить</button>
                                    <div> <input class="inputstyle" type="text"></div>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div>
                                <label class="username">Имя Фамилия</label>
                            </div>
                            <div class="size">
                                <div class="button-change-input">
                                    <button>Изменить</button>
                                    <div> <input class="inputstyle" type="text"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <div class="blocks">
                <div class="count-post styleshadow">
                    <label class="countposttitle">Количество постов:</label>
                    <label class="countpostnumer">15</label>
                </div>
                <form class="form-change-password styleshadow">
                    <label class="label-form-change-password">Форма для смены пароля</label>
                    <div class="block-form-change-password">
                        <div class="form-password-input">
                            <div><label>Старый пароль:</label></div>
                            <div><input type="password" name="" id=""></div>
                            <div><label>Новый пароль:</label></div>
                            <div><input type="password" name="" id=""></div>
                            <div><label>Повторите новый пароль:</label></div>
                            <div><input type="password" name="" id=""></div>
                        </div>
                        <div class="button-change-password"><button>Изменить</button></div>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer class=" footer ">
        <div class="block-menu-footer ">
            <div><a href="main.html ">Главная</a></div>
            <div><a href="profile.html ">Профиль</a></div>
            <div><a href="newpost.html ">Создать пост</a></div>
        </div>
        <div class="block-signature-footer ">
            <div>
                <a href="https://vk.com/mosolova2003 ">Разработано Мосоловой В.Г.</a>
            </div>
        </div>
    </footer>
</body>

</html>
